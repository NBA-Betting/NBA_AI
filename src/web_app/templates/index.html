{% extends "base.html" %}

{% block body_attrs %}data-query-date="{{ query_date_str }}"{% endblock %}

{% block content %}
<!-- Date Navigation -->
<nav aria-label="Date navigation" class="mt-4">
    <div class="date-nav">
        <a class="date-nav-arrow" href="{{ url_for('home', date=prev_date) }}" aria-label="Previous day">&lt;&lt;</a>

        <!-- Current Date / Calendar Toggle -->
        <div class="date-picker">
            <button type="button" id="datePickerToggle" class="date-nav-current" aria-haspopup="dialog"
                aria-expanded="false">
                <i class="bi bi-calendar3 me-2"></i>{{ query_date_display_str }}
            </button>

            <!-- Calendar Panel -->
            <div id="datePickerPanel" class="date-picker-panel" role="dialog" aria-label="Choose a date" hidden>
                <div class="date-picker-header">
                    <button type="button" class="date-picker-nav" id="calPrevMonth" aria-label="Previous month">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                    <span class="date-picker-month" id="calMonthLabel" aria-live="polite"></span>
                    <button type="button" class="date-picker-nav" id="calNextMonth" aria-label="Next month">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
                <div class="date-picker-weekdays" aria-hidden="true">
                    <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
                </div>
                <div class="date-picker-grid" id="calGrid"></div>
                <div class="date-picker-footer">
                    <span class="date-picker-legend"><span class="date-picker-dot"></span>has games</span>
                    <button type="button" class="date-picker-today" id="calToday">Today</button>
                </div>
            </div>
        </div>

        <a class="date-nav-arrow" href="{{ url_for('home', date=next_date) }}" aria-label="Next day">&gt;&gt;</a>
    </div>
</nav>

<!-- Games Table -->
<div class="container mt-4">
    <div class="table-responsive">
        <table class="table games-table">
            <thead>
                <tr>
                    <th rowspan="2"></th> <!-- Time / status -->
                    <th rowspan="2">Home</th>
                    <th rowspan="2">Away</th>
                    <th rowspan="2" class="text-center d-none d-sm-table-cell">Open</th>
                    <th colspan="2" class="text-center">Score</th>
                    <th colspan="2" class="text-center">Predictions</th>
                </tr>
                <tr>
                    <th class="text-center">Home</th>
                    <th class="text-center">Away</th>
                    <th class="text-center">Spread</th>
                    <th class="text-center">Winner</th>
                </tr>
            </thead>
            <tbody id="gamesTableBody">
                <tr>
                    <td colspan="8" class="text-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Game Details Modal -->
<div class="modal fade" id="gameDetailsModal" tabindex="-1" aria-labelledby="gameDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header border-bottom">
                <h5 class="modal-title text-center flex-grow-1" id="gameDetailsModalLabel">Game Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body"></div>
        </div>
    </div>
</div>

<!-- Game Details Template -->
<template id="gameDetailsTemplate">
    <!-- Teams and spreads -->
    <div class="row mb-3 pb-3 border-bottom">
        <div class="col text-center">
            <img id="templateHomeLogo" src="" alt="" class="modal-team-logo mb-2">
            <h4 id="templateHomeTeam" class="mb-0"></h4>
        </div>
        <div class="col text-center d-flex flex-column justify-content-center">
            <div class="mb-2">
                <span class="stat-label">OPEN</span>
                <h4 class="mb-0" id="templateOpenSpread"></h4>
            </div>
            <div class="mb-2">
                <span class="stat-label">PREDICTED</span>
                <h4 class="mb-0" id="templatePredictedSpread"></h4>
            </div>
            <div id="templateResultSection" hidden>
                <span class="stat-label">ACTUAL</span>
                <h4 class="mb-0" id="templateActualMargin"></h4>
            </div>
        </div>
        <div class="col text-center">
            <img id="templateAwayLogo" src="" alt="" class="modal-team-logo mb-2">
            <h4 id="templateAwayTeam" class="mb-0"></h4>
        </div>
    </div>

    <!-- Predicted winner: the arrow points at the team -->
    <div class="row mb-3 pb-3 border-bottom">
        <div class="col text-center d-flex justify-content-center align-items-center">
            <i class="bi bi-caret-left-fill winner-arrow me-1" id="winnerLeftIcon"></i>
            <div>
                <span class="stat-label">PREDICTED WINNER</span>
                <h4 id="templatePredictedWinPct" class="mb-0"></h4>
            </div>
            <i class="bi bi-caret-right-fill winner-arrow ms-1" id="winnerRightIcon"></i>
        </div>
    </div>

    <!-- Top players, under each team's column -->
    <div class="row mb-3 pb-3 border-bottom">
        <div class="col d-flex justify-content-center">
            <div id="homeTeamPlayers"></div>
        </div>
        <div class="col-2 d-none d-sm-block"></div>
        <div class="col d-flex justify-content-center">
            <div id="awayTeamPlayers"></div>
        </div>
    </div>

    <!-- Play By Play (collapsible) -->
    <div class="row">
        <div class="col">
            <button class="btn btn-outline-secondary btn-sm w-100 mb-2" type="button" data-bs-toggle="collapse"
                data-bs-target="#pbpCollapse" aria-expanded="false" aria-controls="pbpCollapse">
                Play By Play
            </button>
            <div class="collapse" id="pbpCollapse">
                <table class="table table-sm">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Play</th>
                            <th id="homeTeamHeader">Home</th>
                            <th id="awayTeamHeader">Away</th>
                        </tr>
                    </thead>
                    <tbody id="playByPlayBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</template>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
